[package]
name = "opsec-dashboard"
version = "0.3.0"
edition = "2024"
description = "Live OPSEC health checks for a Linux host, in the terminal"
readme = "README.md"
license = "MIT"
categories = ["command-line-utilities"]
keywords = ["security", "opsec", "tui", "hardening", "linux"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
